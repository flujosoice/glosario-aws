[project]
name = "backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = ["integration: requiere TEST_DATABASE_URL (PostgreSQL real)"]

# Cobertura (Intelix COD6, puerta a producción: >= 80 %). Medir con la integración activa:
#   TEST_DATABASE_URL=... pytest --cov --cov-report=xml:coverage.xml
[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
skip_covered = true
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["domain", "application", "infrastructure", "entrypoints", "shared", "fakes"]
