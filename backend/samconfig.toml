  "DbProxyEndpoint=/qa/glosario/db/proxy-endpoint",
  "DbSecretName=/qa/glosario/db/app",
  "DbName=may_qa_glosario_db",
  "AllowedOrigins=/qa/glosario/frontend/origin",
]
tags = [
  "Project=GLOSARIO",
  "Environment=QA",
  "Name=qa-glosario-api",
]

[prod.build.parameters]
