version = 0.1

[dev.build.parameters]
cached = true
parallel = true

[dev.deploy.parameters]
stack_name = "dev-glosario-api"
region = "us-west-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
s3_prefix = "dev-glosario-api"
parameter_overrides = [
  "Environment=dev",
  "VpcSubnetIds=/dev/glosario/network/subnets",
  "LambdaSecurityGroupId=/dev/glosario/network/lambda-sg",
  "DbProxyEndpoint=/dev/glosario/db/proxy-endpoint",
  "DbSecretName=/dev/glosario/db/app",
  "DbName=may_dev_glosario_db",
  "AllowedOrigins=/dev/glosario/frontend/origin",
]
tags = [
  "Project=GLOSARIO",
  "Environment=DEV",
  "Name=dev-glosario-api",
]

[qa.build.parameters]
cached = true
parallel = true

[qa.deploy.parameters]
stack_name = "qa-glosario-api"
region = "us-west-2"
confirm_changeset = true
