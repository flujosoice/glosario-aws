  DbRole:
    Type: AWS::IAM::Role
    Properties:
      Description: 'GLOSARIO - rol compartido por 24 función(es): db'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
      - PolicyName: least-privilege
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: WriteOwnLogs
            Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - !GetAtt 'AppendSyncRowsLogGroup.Arn'
            - !GetAtt 'ApplyDictionaryMatchLogGroup.Arn'
            - !GetAtt 'CompleteSyncRunLogGroup.Arn'
            - !GetAtt 'CreateMasterLogGroup.Arn'
            - !GetAtt 'CreateTagLogGroup.Arn'
            - !GetAtt 'CreateTermLogGroup.Arn'
            - !GetAtt 'DeleteMasterLogGroup.Arn'
            - !GetAtt 'DeleteTagLogGroup.Arn'
            - !GetAtt 'DeleteTermLogGroup.Arn'
            - !GetAtt 'DiscardDictionaryMatchLogGroup.Arn'
            - !GetAtt 'ExpireStaleSyncRunsJobLogGroup.Arn'
            - !GetAtt 'FailSyncRunLogGroup.Arn'
            - !GetAtt 'GetAccessLogGroup.Arn'
            - !GetAtt 'GetCatalogsLogGroup.Arn'
            - !GetAtt 'GetHealthLogGroup.Arn'
            - !GetAtt 'ListAdminTermsLogGroup.Arn'
            - !GetAtt 'ListDictionaryMatchesLogGroup.Arn'
            - !GetAtt 'ListSyncRunsLogGroup.Arn'
            - !GetAtt 'ListTermsLogGroup.Arn'
            - !GetAtt 'ReopenDictionaryMatchLogGroup.Arn'
            - !GetAtt 'RestoreTermLogGroup.Arn'
            - !GetAtt 'SearchSoftlandDictionaryLogGroup.Arn'
            - !GetAtt 'StartSyncRunLogGroup.Arn'
            - !GetAtt 'UpdateTermLogGroup.Arn'
          - Sid: ReadDbSecret
            Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-??????'
  ApiWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${AWS::StackName}-api-waf'
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${AWS::StackName}-api-waf'
      Rules:
      - Name: RateLimitPerIp
        Priority: 0
        Statement:
          RateBasedStatement:
            Limit: !Ref 'WafRateLimit'
            AggregateKeyType: IP
        VisibilityConfig:
          SampledRequestsEnabled: true
          CloudWatchMetricsEnabled: true
          MetricName: RateLimitPerIp
        Action:
          Block: {}
      - Name: AWSManagedCommon
        Priority: 1
        Statement:
          ManagedRuleGroupStatement:
            VendorName: AWS
            Name: AWSManagedRulesCommonRuleSet
        VisibilityConfig:
          SampledRequestsEnabled: true
          CloudWatchMetricsEnabled: true
          MetricName: AWSManagedCommon
        OverrideAction:
          None: {}
      - Name: AWSManagedKnownBadInputs
        Priority: 2
        Statement:
          ManagedRuleGroupStatement:
            VendorName: AWS
            Name: AWSManagedRulesKnownBadInputsRuleSet
        VisibilityConfig:
          SampledRequestsEnabled: true
          CloudWatchMetricsEnabled: true
          MetricName: AWSManagedKnownBadInputs
        OverrideAction:
          None: {}
  ApiWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn: ApiStage
    Properties:
      ResourceArn: !Sub 'arn:aws:apigateway:${AWS::Region}::/restapis/${Api}/stages/${Environment}'
      WebACLArn: !GetAtt 'ApiWebAcl.Arn'
Outputs:
  UserPoolId:
    Condition: CreateUserPool
    Value: !Ref 'UserPool'
    Description: COGNITO_USER_POOL_ID del frontend
  UserPoolClientId:
    Condition: CreateUserPool
    Value: !Ref 'UserPoolClient'
    Description: COGNITO_CLIENT_ID del frontend
  ApiUrl:
    Description: URL base del API (VITE_/NEXT_PUBLIC_/REACT_APP_API_BASE_URL)
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
