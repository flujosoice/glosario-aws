AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: GLOSARIO - API | Backend serverless (Lambda + API Gateway + Aurora)
Parameters:
  Environment:
    Type: String
    AllowedValues:
    - dev
    - qa
    - prod
    Description: Ambiente de despliegue
  VpcSubnetIds:
    Type: AWS::SSM::Parameter::Value<List<AWS::EC2::Subnet::Id>>
    Description: Ruta SSM con las subnets privadas de las Lambdas
  LambdaSecurityGroupId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::SecurityGroup::Id>
    Description: Ruta SSM con el Security Group de las Lambdas
  DbProxyEndpoint:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Ruta SSM con el endpoint de RDS Proxy / Aurora
  DbSecretName:
    Type: String
    Description: Nombre del secreto de usr_<app>_app (nunca la password)
  DbName:
    Type: String
    Description: Base Aurora del ambiente ({compania}_{amb}_{app}_db)
  AllowedOrigins:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Ruta SSM con el origen del frontend (CORS estricto)
  CognitoUserPoolArn:
    Type: String
    Default: ''
    Description: ARN de un User Pool existente; vacío = crear uno en el stack
  AlarmTopicArn:
    Type: String
    Default: ''
    Description: SNS para alarmas (opcional)
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
    - DEBUG
    - INFO
    - WARNING
    - ERROR
  WafRateLimit:
    Type: Number
    Default: 2000
    MinValue: 100
    Description: Peticiones por IP cada 5 minutos antes de bloquear
Conditions:
  IsProduction: !Equals
  - !Ref 'Environment'
  - prod
  CreateUserPool: !Equals
  - !Ref 'CognitoUserPoolArn'
  - ''
  HasAlarmTopic: !Not
  - !Equals
    - !Ref 'AlarmTopicArn'
    - ''
Globals:
  Function:
    Runtime: python3.13
    Architectures:
    - x86_64
    MemorySize: 512
    Timeout: 30
    CodeUri: src/
    VpcConfig:
      SubnetIds: !Ref 'VpcSubnetIds'
      SecurityGroupIds:
      - !Ref 'LambdaSecurityGroupId'
    Environment:
      Variables:
        ENVIRONMENT: !Ref 'Environment'
        SERVICE_NAME: glosario
        LOG_LEVEL: !Ref 'LogLevel'
        DB_SECRET_NAME: !Ref 'DbSecretName'
        DB_NAME: !Ref 'DbName'
        DB_PROXY_ENDPOINT: !Ref 'DbProxyEndpoint'
        DB_PORT: '5432'
        DB_SSLMODE: require
        ALLOWED_ORIGINS: !Ref 'AllowedOrigins'
Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Condition: CreateUserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes:
      - email
      AutoVerifiedAttributes:
      - email
      MfaConfiguration: OPTIONAL
      EnabledMfas:
      - SOFTWARE_TOKEN_MFA
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AccountRecoverySetting:
        RecoveryMechanisms:
        - Name: verified_email
          Priority: 1
      DeletionProtection: !If [IsProduction, ACTIVE, INACTIVE]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      UserPoolTags:
        Project: GLOSARIO
        Environment: !Ref 'Environment'
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: CreateUserPool
    Properties:
      ClientName: !Sub '${AWS::StackName}-web'
      UserPoolId: !Ref 'UserPool'
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_SRP_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
  ProcesosUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: CreateUserPool
    Properties:
      GroupName: procesos
      UserPoolId: !Ref 'UserPool'
      Description: GLOSARIO - grupo procesos
  ConsultaUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: CreateUserPool
    Properties:
      GroupName: consulta
      UserPoolId: !Ref 'UserPool'
      Description: GLOSARIO - grupo consulta
  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      Description: GLOSARIO - API | REST API (public)
      StageName: !Ref 'Environment'
      EndpointConfiguration:
        Type: REGIONAL
      OpenApiVersion: 3.0.1
      Cors:
        AllowOrigin: !Sub '''${AllowedOrigins}'''
        AllowHeaders: '''Authorization,Content-Type'''
        AllowMethods: '''GET,POST,PUT,PATCH,DELETE,OPTIONS'''
        MaxAge: '''600'''
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !If
            - CreateUserPool
            - !GetAtt 'UserPool.Arn'
            - !Ref 'CognitoUserPoolArn'
            Identity:
              Header: Authorization
      MethodSettings:
      - ResourcePath: /*
        HttpMethod: '*'
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub '''${AllowedOrigins}'''
              Access-Control-Allow-Headers: '''Authorization,Content-Type'''
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub '''${AllowedOrigins}'''
              Access-Control-Allow-Headers: '''Authorization,Content-Type'''
        UNAUTHORIZED:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub '''${AllowedOrigins}'''
              Access-Control-Allow-Headers: '''Authorization,Content-Type'''
        ACCESS_DENIED:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub '''${AllowedOrigins}'''
              Access-Control-Allow-Headers: '''Authorization,Content-Type'''
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-api5xx'
      AlarmDescription: GLOSARIO - errores 5XX en API Gateway
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Threshold: 1
      Period: 300
      Statistic: Sum
      TreatMissingData: notBreaching
      AlarmActions: !If
      - HasAlarmTopic
      - - !Ref 'AlarmTopicArn'
      - !Ref 'AWS::NoValue'
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
      - Name: ApiName
        Value: !Sub '${AWS::StackName}-api'
  GetAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-get-access'
      RetentionInDays: !If [IsProduction, 30, 7]
  GetAccessFunction:
