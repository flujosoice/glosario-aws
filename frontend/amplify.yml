# Amplify Hosting — SPA (Vite). Variables públicas por ambiente (rama) en la consola de Amplify o en el
# pipeline: VITE_API_BASE_URL, VITE_APP_EXPOSURE. Rewrite SPA en Amplify:
# origen </^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>
# → /index.html (200).
# La app se embebe en el Portal Interno Mayoreo (iframe): en lugar de X-Frame-Options DENY se usa
# CSP frame-ancestors con el dominio del Portal. Confirmar el dominio con Sistemas antes del despliegue
# (hoy *.mayoreo.biz).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: no-referrer
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.execute-api.us-west-2.amazonaws.com; frame-ancestors 'self' https://*.mayoreo.biz; base-uri 'self'; form-action 'self'"
