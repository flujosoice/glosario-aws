  language: ts
  router: react-router
  monolith: false
  schema_source: database/source
target:
  aws_region: us-west-2
  api_endpoint_type: REGIONAL
  frontend_hosting: amplify-static
  lambda:
    memory: 512
    timeout: 30
    architecture: x86_64
  cognito:
    groups:
    - procesos
    - consulta
  database:
    engine: aurora-postgresql
    rls_mode: backend
modules:
- name: access
  entities:
  - llaves_acceso
  use_cases:
  - GetAccessUseCase
  - GetHealthUseCase
- name: glossary
  entities:
  - terminos
  - termino_campos_bd
  - definicion_fragmentos
  - termino_etiquetas
  - termino_maestros
  - auditoria_terminos
  use_cases:
  - ListTermsUseCase
  - ListAdminTermsUseCase
  - CreateTermUseCase
  - UpdateTermUseCase
  - DeleteTermUseCase
  - RestoreTermUseCase
- name: catalogs
