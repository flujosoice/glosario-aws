  - RF-13
database_objects:
  naming_map: database/naming-map.json
  generation_report: database/generation-report.json
environment_variables:
  backend:
  - ENVIRONMENT
  - SERVICE_NAME
  - LOG_LEVEL
  - DB_SECRET_NAME
  - DB_NAME
  - DB_PROXY_ENDPOINT
  - DB_PORT
  - DB_SSLMODE
  - ALLOWED_ORIGINS
  frontend:
  - VITE_API_BASE_URL
  - VITE_APP_EXPOSURE
  - VITE_PORTAL_ORIGIN
authorization_rules:
- table: terminos
  policy: todos leen los términos activos; solo Procesos crea, edita, elimina y restaura
  command: ALL
  roles:
  - consulta
  - procesos
  using: 'lectura: eliminado_en IS NULL; escritura: llave de administración vigente'
  with_check: null
  enforced_in: ListTermsUseCase (solo activos) y require_admin en ListAdminTerms/Create/Update/Delete/RestoreTermUseCase
- table: etiquetas
  policy: todos leen; Procesos agrega y elimina solo las que no son base
  command: ALL
  roles:
  - consulta
  - procesos
  using: 'escritura: llave de administración y es_base = false'
  with_check: null
  enforced_in: GetCatalogsUseCase; require_admin + regla es_base en CreateTagUseCase/DeleteTagUseCase
- table: maestros
  policy: todos leen; Procesos agrega y elimina solo agregados sin términos
  command: ALL
  roles:
  - consulta
  - procesos
  using: 'escritura: llave de administración, es_base = false y sin términos'
  with_check: null
  enforced_in: GetCatalogsUseCase; require_admin + reglas en CreateMasterUseCase/DeleteMasterUseCase
- table: sugerencias_diccionario
  policy: solo Procesos revisa coincidencias y busca en el diccionario
  command: ALL
  roles:
  - procesos
  using: llave de administración vigente
  with_check: null
  enforced_in: require_admin en los casos de uso de dictionary (List/Apply/Discard/Reopen/SearchSoftlandDictionary)
- table: sincronizaciones
  policy: solo n8n con llave de ingesta registra cargas; Procesos o n8n consultan la bitácora
  command: ALL
  roles:
  - procesos
  using: 'escritura: llave de ingesta; lectura: llave de administración o de ingesta'
  with_check: null
  enforced_in: require_ingest en Start/Append/Complete/FailSyncRunUseCase; require_any en ListSyncRunsUseCase
- table: llaves_acceso
  policy: nadie la lee ni escribe desde la API; las llaves se dan de alta por SQL (solo el hash)
  command: ALL
  roles: []
  using: solo búsqueda por hash dentro de AccessGuard
  with_check: null
  enforced_in: PostgresAccessKeyRepository.find_active (sin endpoints de gestión)
structural_changes:
- 'Sin Cognito: dos enlaces (general y administración) embebidos en el Portal Interno Mayoreo; las escrituras se validan con
  llaves de acceso (hash SHA-256 en tbl_llaves_acceso) en lugar de grupos de Cognito'
- Todos los endpoints van con Authorizer NONE + public_reason y exposure public para tener WAF; la autorización real está
  en los casos de uso (AccessGuard)
- GET /me devuelve {puedeAdministrar, etiqueta} según la llave enviada, en lugar de resolver un usuario de Cognito
- El esquema SQL Server del paquete (db/esquema.sql) se convirtió a PostgreSQL con etiquetas y maestros por id, campos BD
  por filas y borrado lógico con eliminado_en
- 'Datos iniciales: database/tools/generar_semilla.py → database/source/900_seed_glosario.sql → aurora_postgresql_data.sql
  por ambiente (export_data_sql.py)'
- 'Ingesta de n8n por cargas: iniciar → lotes de filas → completar (cambia la versión vigente en una transacción) o fallar;
  las cargas en curso por más de 2 horas se marcan fallidas cada hora'
- Eliminar una etiqueta agregada la quita también de los términos que la tenían (ON DELETE CASCADE)
- La plantilla mantiene shared/auth/cognito-auth.ts y la dependencia aws-amplify porque el validador del estándar las exige;
  la app no las importa
incompatibilities: []
migration_risks:
- 'Quien tenga el enlace de administración (llave incluida) puede escribir: el Portal Interno Mayoreo debe mostrarlo solo
  a Procesos; las llaves se rotan revocándolas en tbl_llaves_acceso'
- 'Corte final: hay que volver a exportar la base de claude.ai (49 coincidencias pendientes) y regenerar la semilla antes
  de producción'
- El template estándar crea un User Pool de Cognito si no se pasa CognitoUserPoolArn; la app no lo usa
- El dominio del Portal Interno Mayoreo (frame-ancestors en amplify.yml y ALLOWED_ORIGINS) se confirma con Sistemas
pending_errors: []
