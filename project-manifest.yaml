  - sugerencia_opciones
  use_cases:
  - ListDictionaryMatchesUseCase
  - ApplyDictionaryMatchUseCase
  - DiscardDictionaryMatchUseCase
  - ReopenDictionaryMatchUseCase
  - SearchSoftlandDictionaryUseCase
- name: sync
