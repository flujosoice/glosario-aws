  - sincronizaciones
  - atributos_maestro
  - diccionario_softland
  use_cases:
  - ListSyncRunsUseCase
  - StartSyncRunUseCase
  - AppendSyncRowsUseCase
  - CompleteSyncRunUseCase
  - FailSyncRunUseCase
  - ExpireStaleSyncRunsUseCase
