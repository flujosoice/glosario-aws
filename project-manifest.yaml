# Contrato técnico del Glosario de Términos (references/project-contract.md).
version: 1
kind: greenfield
draft: false
project:
  name: Glosario de Términos
  slug: glosario
  compania: may
  label: GLOSARIO
  exposure: public
  public_reason: 'Sin Cognito por decisión del negocio: la app se embebe en el Portal Interno Mayoreo, que controla quién
    abre el enlace general (solo lectura) y el enlace de administración de Procesos. La API queda alcanzable desde internet
    sin sesión de usuario, por eso va con WAF (reglas administradas y límite de peticiones), CORS restringido al dominio de
    la app y llaves de acceso validadas en el backend para toda escritura (llave de administración) y para la ingesta de n8n
    (llave de ingesta).

    '
source:
